<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Chrono BO Escrime</title>
<link rel="manifest" href="manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Chrono BO">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#080808">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{margin:0;background:#080808;}
#app{height:100dvh;min-height:100dvh;background:#080808;color:#ddd;display:flex;flex-direction:column;max-width:480px;margin:0 auto;user-select:none;-webkit-user-select:none;font-family:'Rajdhani',sans-serif;overflow:hidden;}
.bb{font-family:'Bebas Neue',cursive;}
@keyframes fS{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes shine{0%,100%{opacity:1}50%{opacity:.6}}
button{touch-action:manipulation;cursor:pointer;}
.toast{background:#1e1e1e;border:1px solid #303030;border-radius:10px;padding:10px 16px;font-size:13px;font-weight:700;color:#eee;text-align:center;box-shadow:0 8px 24px #000c;animation:fS .25s ease;pointer-events:none;}
.hdr{display:flex;align-items:center;padding:4px 8px;gap:5px;border-bottom:1px solid #181818;background:#0d0d0d;flex-shrink:0;}
.mode-btn{padding:4px 9px;font-size:10px;letter-spacing:1px;font-weight:700;border:none;border-radius:4px;font-family:'Rajdhani',sans-serif;}
.panel{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:10px 6px 8px;position:relative;height:100%;}
.panel-r{background:linear-gradient(180deg,rgba(70,0,0,.45) 0%,transparent 75%);border-right:1px solid #1c1c1c;}
.panel-g{background:linear-gradient(180deg,rgba(0,60,20,.45) 0%,transparent 75%);}
.cards-row{display:flex;gap:3px;flex-wrap:wrap;justify-content:center;min-height:22px;margin-top:2px;}
.cr{display:inline-block;width:13px;height:19px;border-radius:2px;}
.bp{width:64px;height:56px;border:none;border-radius:8px;font-size:34px;font-weight:900;font-family:'Bebas Neue',cursive;}
.bm{width:42px;height:56px;background:#161616;color:#444;border:1px solid #2a2a2a;border-radius:8px;font-size:22px;font-family:'Bebas Neue',cursive;}
.bc{width:38px;height:38px;border-radius:6px;font-size:17px;display:flex;align-items:center;justify-content:center;}
.timers{padding:10px 12px 12px;border-top:1px solid #181818;background:#0c0c0c;flex-shrink:0;}
.ctrl-row{display:flex;gap:8px;margin-top:4px;}
.bs{flex:1;width:100%;padding:0;border-radius:0;font-size:36px;min-height:140px;font-weight:700;letter-spacing:3px;font-family:'Rajdhani',sans-serif;transition:all .2s;}
.bsm{flex:1;padding:18px 0;border-radius:10px;font-size:11px;font-weight:700;letter-spacing:1px;font-family:'Rajdhani',sans-serif;}
.excl{position:absolute;top:5px;font-size:9px;color:#666;letter-spacing:1px;background:#111;border:1px solid #333;border-radius:3px;padding:1px 5px;}
#tb-panel{border-top:2px solid #2a1f00;background:#090800;}
.tbs{padding:14px 12px;text-align:center;}
</style>
</head>

<script>
const S={relayHistory:[],relayPrevR:0,relayPrevV:0,mute:false,mode:'individual',period:1,pDone:false,over:false,restMode:false,restTime:60,R:{s:0,y:0,r:0,b:false},V:{s:0,y:0,r:0,b:false},mT:180,pT:60,run:false,tb:'none',pri:null,tbW:'',tbR:'',log:[],showL:false};
let iv=null,restIv=null;
let audioCtx=null;
function getAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();return audioCtx;}
function playBeep(freq,dur,vol,delay){if(S.mute)return;try{const ctx=getAudio();const osc=ctx.createOscillator();const g=ctx.createGain();osc.connect(g);g.connect(ctx.destination);osc.frequency.value=freq;osc.type='square';const t=ctx.currentTime+(delay||0);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+0.01);g.gain.setValueAtTime(vol,t+dur-0.02);g.gain.linearRampToValueAtTime(0,t+dur);osc.start(t);osc.stop(t+dur+0.05);}catch(e){}}
function playBuzzer(){playBeep(880,0.12,0.5,0);playBeep(880,0.12,0.5,0.18);playBeep(880,0.12,0.5,0.36);playBeep(600,0.8,0.6,0.6);}

const fmt=t=>{t=Math.max(0,t|0);return Math.floor(t/60)+':'+(t%60<10?'0':'')+(t%60);};
const vib=p=>{try{navigator.vibrate(p);}catch(e){}};

const opp=s=>s==='r'?'V':'R';
const SD=s=>s==='r'?S.R:S.V;
function toast(m,d=3500){const el=document.createElement('div');el.className='toast';el.textContent=m;const a=document.getElementById('ta');a.appendChild(el);setTimeout(()=>{if(el.parentNode)el.parentNode.removeChild(el);},d);}
function addLog(m){const t=new Date().toLocaleTimeString('fr-FR');S.log.unshift({t,m});if(S.log.length>50)S.log.pop();document.getElementById('lc').textContent=S.log.length;if(S.showL)renderLog();}
function renderLog(){const a=document.getElementById('la');a.innerHTML=S.log.length===0?'<div style="color:#2a2a2a;font-size:12px;text-align:center;padding:12px;">Aucun événement</div>':S.log.map(e=>'<div style="display:flex;gap:8px;padding:3px 0;border-bottom:1px solid #111;font-size:11px;"><span style="color:#2a2a2a;min-width:58px;flex-shrink:0;">'+e.t+'</span><span style="color:#555;">'+e.m+'</span></div>').join('');}
function giveYellow(s){const d=SD(s),o=opp(s),dn=sn(s),on=sn(o==='R'?'r':'v');if(d.b)return;d.y++;if(d.y>=3){d.b=true;toast('⬛ CARTON NOIR — '+dn+' exclu !',6000);addLog('⬛ NOIR — '+dn);}else if(d.y===2){d.r++;SD(o==='R'?'r':'v').s++;toast('🟥 2 jaunes → Rouge — +1 pt '+on);addLog('🟥 Rouge auto — '+dn);}else{toast('🟨 Jaune — '+dn);addLog('🟨 Jaune — '+dn);}vib(80);}
function giveCard(s,t){if(S.over)return;const d=SD(s),o=opp(s),dn=sn(s),on=sn(o==='R'?'r':'v');if(t==='y'){giveYellow(s);}else if(t==='r2'){d.r++;SD(o==='R'?'r':'v').s++;toast('🟥 Rouge — '+dn+' | +1 '+on);addLog('🟥 Rouge — '+dn);vib(150);}else{d.b=true;toast('⬛ NOIR — '+dn+' exclu !',6000);addLog('⬛ NOIR — '+dn);vib([100,50,100]);}ra();}
function checkEnd(){if(S.period<maxP())return;if(S.R.s===S.V.s){S.tb='pending';toast('⚖ EX AEQUO ! Tirage requis.',6000);addLog('⚖ Ex aequo');}else{S.over=true;const w=S.R.s>S.V.s?'Rouge':'Vert';toast('🏆 '+w+' GAGNE !',8000);addLog('🏆 '+w+' ('+S.R.s+'-'+S.V.s+')');;}}
function addPt(s){if(S.over)return;const d=SD(s),dn=sn(s);if(S.tb==='active'){d.s++;stopT();S.tb='done';S.over=true;S.tbW=dn;S.tbR='PAR TOUCHE EN PROLONGATION';toast('🏆 '+dn+' GAGNE par touche !',8000);addLog('🏆 OT — '+dn);S.pT=60;ra();return;}d.s++;S.pT=60;addLog('🎯 Touche '+dn+' ('+d.s+')');vib(30);if(S.mode==='equipe'&&d.s>=S.period*5){stopT();recordRelay();S.pDone=true;toast('🏁 '+dn+' '+d.s+' pts — Fin assaut !',5000);addLog('🏁 Fin P'+S.period);checkEnd();}if(S.mode==='individual'&&d.s>=15){stopT();S.over=true;toast('🏆 '+dn+' GAGNE !',8000);addLog('🏆 '+dn);}ra();}
function subPt(s){if(S.over)return;const d=SD(s);d.s=Math.max(0,d.s-1);ra();}
function tick(){if(S.tb==='active'){S.pT--;if(S.pT<=0){S.pT=60;stopT();playCardBeep();toast('⏸ 1 min sans touche (OT) — Cartons jaunes !\nReprenez quand prêts.',5000);addLog('⏸ 1 min sans touche OT');giveYellow('r');giveYellow('v');ra();return;}S.mT--;if(S.mT<=0){S.mT=0;stopT();S.tb='done';S.over=true;const pn=S.pri==='r'?'Rouge':'Vert';S.tbW=pn;S.tbR='PAR PRIORITÉ';playBuzzer();toast('🏆 '+pn+' GAGNE par priorité !',8000);addLog('🏆 Priorité — '+pn);}ra();return;}S.pT--;if(S.pT<=0){S.pT=60;stopT();playCardBeep();toast('⏸ 1 min sans touche — Cartons jaunes !\nReprenez quand prêts.',5000);addLog('⏸ 1 min sans touche — pause');giveYellow('r');giveYellow('v');ra();return;}S.mT--;if(S.mT===30)playWarning();if(S.mT<=0){S.mT=0;stopT();playBuzzer();addLog('⏱ Fin P'+S.period);if(S.mode==='individual'&&S.period<maxP()){startRest();}else{if(S.mode==='equipe')recordRelay();S.pDone=true;toast('⏱ Période '+S.period+' terminée !');checkEnd();}}ra();}
function startT(){if(!iv){iv=setInterval(tick,1000);S.run=true;}}
function stopT(){if(iv){clearInterval(iv);iv=null;}S.run=false;}
function toggleTimer(){if(S.over)return;if(S.restMode){skipRest();return;}if(S.tb==='pending'||S.tb==='drawn'||S.tb==='done')return;if(S.pDone&&S.tb==='none')return;if(S.run){stopT();vib([80,40,80]);}else{startT();vib(100);}ra();}
function drawPriority(){S.pri=Math.random()<0.5?'r':'v';S.tb='drawn';const pn=S.pri==='r'?'Rouge':'Vert';toast('🎲 Priorité : '+pn+' !',5000);addLog('🎲 Priorité : '+pn);vib([50,30,50,30,100]);ra();}
function startOT(){S.mT=60;S.pT=60;S.tb='active';startT();addLog('⏱ Prolongation 1 min');toast('EN GARDE — Prolongation !',3000);ra();}

function resetAll(){stopT();stopRest();S.relayHistory=[];S.relayPrevR=0;S.relayPrevV=0;S.R={s:0,y:0,r:0,b:false};S.V={s:0,y:0,r:0,b:false};S.mT=180;S.pT=60;S.period=1;S.pDone=false;S.over=false;S.tb='none';S.pri=null;S.tbW='';S.tbR='';S.log=[];document.getElementById('lc').textContent='0';document.getElementById('la').innerHTML='';document.getElementById('ta').innerHTML='';vib([50,30,50]);ra();}
function setMode(m){S.mode=m;document.getElementById('bi').style.background=m==='individual'?'#ffaa00':'#181818';document.getElementById('bi').style.color=m==='individual'?'#000':'#444';document.getElementById('be').style.background=m==='equipe'?'#ffaa00':'#181818';document.getElementById('be').style.color=m==='equipe'?'#000':'#444';}

function renderSide(s){const d=SD(s),col=s==='r'?'#ff3333':'#22cc66',id=s==='r'?'r':'v';document.getElementById('s'+id).textContent=d.s;document.getElementById('s'+id).style.textShadow=S.run?'0 0 35px '+col+'55':'none';document.getElementById('p'+id).style.opacity=d.b?'0.5':'1';document.getElementById('x'+id).style.display=d.b?'block':'none';let h='';for(let i=0;i<Math.min(d.y,6);i++)h+='<span class="cr" style="background:#ffd700;"></span>';for(let i=0;i<Math.min(d.r,3);i++)h+='<span class="cr" style="background:#cc1111;"></span>';if(d.b)h+='<span class="cr" style="background:#111;border:1.5px solid #555;"></span>';document.getElementById('c'+id).innerHTML=h;}
function renderTimers(){const A='#ffaa00';const mt=document.getElementById('mt'),pt=document.getElementById('pt');
const lbl=document.getElementById('assautLabel');
if(lbl){if(S.restMode){lbl.textContent='PAUSE';}else if(S.mode==='equipe'){lbl.textContent='RELAIS '+S.period+' · CIBLE '+S.period*5+'PTS';}else{lbl.textContent='ASSAUT · P'+S.period+'/3';}}if(S.restMode){mt.textContent=fmt(S.restTime);mt.style.color='#4488ff';mt.style.textShadow='0 0 18px #4488ff44';pt.textContent='--:--';pt.style.color='#222';pt.style.textShadow='none';return;}mt.textContent=fmt(S.mT);mt.style.color=S.mT<=30&&S.mT>0&&S.tb!=='active'?'#ff4444':S.tb==='active'?'#bb88ff':A;mt.style.textShadow=S.run?'0 0 18px '+(S.tb==='active'?'#bb88ff44':S.mT<=30?'#ff444455':A+'44'):'none';pt.textContent=fmt(S.pT);pt.style.color=S.pT<=10?'#ff3333':S.pT<=20?'#ff8833':'#444';pt.style.textShadow=S.pT<=20&&S.run?'0 0 18px '+(S.pT<=10?'#ff333355':'#ff883355'):'none';}
function renderCtrl(){const mp=maxP(),last=S.period>=mp;const pl=document.getElementById('pl'),bs=document.getElementById('btnS'),bn=document.getElementById('btnN');if(S.tb==='active'){pl.textContent='OT';pl.style.color='#bb88ff';}
else if(S.restMode){pl.textContent='PAUSE';pl.style.color='#4488ff';}
else if(S.mode==='equipe'){pl.textContent='R'+S.period;pl.style.color='#333';}
else{pl.textContent='P'+S.period;pl.style.color='#333';}document.getElementById('ri').style.display=S.run?'flex':'none';if(S.restMode){bs.style.cssText='width:100%;padding:36px 0;border-radius:0;font-size:32px;font-weight:700;letter-spacing:3px;font-family:Rajdhani,sans-serif;transition:all .2s;background:#000d1e;color:#4488ff;border:none;border-top:1px solid #001e3a;';bs.textContent='⏭ REPRENDRE';}
else if(S.run){bs.style.cssText='flex:2;padding:12px 0;border-radius:8px;font-size:15px;font-weight:700;letter-spacing:2px;font-family:Rajdhani,sans-serif;transition:all .2s;background:#1e0000;color:#ff4444;border:1px solid #3a0000;';bs.textContent=S.tb==='active'?'⏸ PAUSE OT':'⏸ PAUSE';}else if(S.over||S.tb==='pending'||S.tb==='drawn'||S.tb==='done'||S.pDone){bs.style.cssText='flex:2;padding:12px 0;border-radius:8px;font-size:15px;font-weight:700;letter-spacing:2px;font-family:Rajdhani,sans-serif;transition:all .2s;background:#0f0f0f;color:#222;border:1px solid #1c1c1c;';bs.textContent='⏹ TERMINÉ';}else{bs.style.cssText='flex:2;padding:12px 0;border-radius:8px;font-size:15px;font-weight:700;letter-spacing:2px;font-family:Rajdhani,sans-serif;transition:all .2s;background:#001e00;color:#44cc66;border:1px solid #003a00;';bs.textContent='▶ DÉMARRER';}if(S.pDone&&!last&&S.tb==='none'){bn.style.cssText='flex:1;padding:12px 0;border-radius:8px;font-size:11px;font-weight:700;letter-spacing:1px;font-family:Rajdhani,sans-serif;background:#001030;color:#4488ff;border:1px solid #002060;';bn.textContent='P'+(S.period+1)+' →';}else if(!S.pDone&&S.tb!=='active'&&S.tb!=='pending'&&S.tb!=='drawn'){bn.style.cssText='flex:1;padding:12px 0;border-radius:8px;font-size:11px;font-weight:700;letter-spacing:1px;font-family:Rajdhani,sans-serif;background:#0f0f0f;color:#444;border:1px solid #1c1c1c;';bn.textContent='↺ PASSIF';}else{bn.style.cssText='flex:1;padding:12px 0;border-radius:8px;font-size:11px;font-weight:700;letter-spacing:1px;font-family:Rajdhani,sans-serif;background:#0f0f0f;color:#1c1c1c;border:1px solid #141414;';bn.textContent='—';}}
function renderTB(){const panel=document.getElementById('tb-panel');if(S.tb==='none'){panel.style.display='none';return;}panel.style.display='block';document.getElementById('tb1').style.display=S.tb==='pending'?'block':'none';document.getElementById('tb2').style.display=S.tb==='drawn'?'block':'none';document.getElementById('tb3').style.display=S.tb==='active'?'block':'none';document.getElementById('tb4').style.display=S.tb==='done'?'block':'none';if(S.pri){const col=S.pri==='r'?'#ff3333':'#22cc66',pn=S.pri==='r'?'★ ROUGE ★':'★ VERT ★';if(S.tb==='drawn'){const pd=document.getElementById('pdis');pd.textContent=pn;pd.style.color=col;}if(S.tb==='active'){const pa=document.getElementById('pact');pa.textContent=S.pri==='r'?'ROUGE':'VERT';pa.style.color=col;}}if(S.tb==='done'&&S.tbW){const tw=document.getElementById('tbw'),col=S.tbW==='Rouge'?'#ff3333':'#22cc66';tw.textContent='🏆 '+S.tbW.toUpperCase()+' GAGNE';tw.style.color=col;document.getElementById('tbr').textContent=S.tbR;}}

function stopRest(){if(restIv){clearInterval(restIv);restIv=null;}S.restMode=false;}
function skipRest(){
  stopRest();
  S.pDone=true;
  toast('⏭ Pause abrégée — Période '+(S.period+1)+' prête !',2500);
  addLog('⏭ Pause abrégée');
  ra();
}
function startRest(){
  stopRest();
  S.restMode=true; S.restTime=60; S.pDone=false;
  playWarning();
  toast('⏸ Pause 1 min — '+fmt(S.restTime),2000);
  addLog('--- Pause entre périodes ---');
  restIv=setInterval(()=>{
    S.restTime--;
    if(S.restTime===10) playWarning();
    if(S.restTime<=0){
      clearInterval(restIv);restIv=null;
      S.restMode=false; S.pDone=true;
      playWarning();
      toast('⏰ Fin de pause — Période '+(S.period+1)+' prête !',4000);
      addLog('--- Fin de pause ---');
    }
    ra();
  },1000);
}


function recordRelay(){
  if(S.mode!=='equipe')return;
  const elapsed=180-S.mT;
  S.relayHistory.push({relay:S.period,r:S.R.s-S.relayPrevR,v:S.V.s-S.relayPrevV,dur:elapsed});
  S.relayPrevR=S.R.s; S.relayPrevV=S.V.s;
}
function showRelays(){
  if(S.mode!=='equipe'||S.relayHistory.length===0){
    toast('Aucun relais terminé pour le moment',2500); return;
  }
  let cumR=0,cumV=0;
  let rows='';
  S.relayHistory.forEach(e=>{
    cumR+=e.r; cumV+=e.v;
    const wr=e.r>e.v?'color:#ff5555':'', wv=e.v>e.r?'color:#44dd77':'';
    const dur=fmt(e.dur||0);
    rows+=`<tr>
      <td style="padding:5px 6px;text-align:center;border-bottom:1px solid #222;color:#555;font-size:13px;">R${e.relay}</td>
      <td style="padding:5px 6px;text-align:center;border-bottom:1px solid #222;font-size:15px;font-weight:700;${wr}">${e.r}</td>
      <td style="padding:5px 6px;text-align:center;border-bottom:1px solid #222;font-size:15px;font-weight:700;${wv}">${e.v}</td>
      <td style="padding:5px 6px;text-align:center;border-bottom:1px solid #222;color:#888;font-size:13px;">${cumR}–${cumV}</td>
      <td style="padding:5px 6px;text-align:center;border-bottom:1px solid #222;color:#444;font-size:12px;">${dur}</td>
    </tr>`;
  });
  // Current relay in progress
  const curR=S.R.s-S.relayPrevR, curV=S.V.s-S.relayPrevV;
  if(!S.pDone&&!S.over){
    const curDur=fmt(180-S.mT);
    rows+=`<tr style="opacity:.5">
      <td style="padding:5px 6px;text-align:center;color:#555;font-size:13px;">R${S.period}…</td>
      <td style="padding:5px 6px;text-align:center;font-size:15px;font-weight:700;color:#ff3333;">${curR}</td>
      <td style="padding:5px 6px;text-align:center;font-size:15px;font-weight:700;color:#22cc66;">${curV}</td>
      <td style="padding:5px 6px;text-align:center;color:#555;font-size:13px;">${S.R.s}–${S.V.s}</td>
      <td style="padding:5px 6px;text-align:center;color:#333;font-size:12px;">${curDur}</td>
    </tr>`;
  }
  const popup=document.getElementById('relayPopup');
  document.getElementById('relayTbody').innerHTML=rows;
  popup.style.display='flex';
}
function closeRelays(){document.getElementById('relayPopup').style.display='none';}


// ── Commande vocale ──
let recognition=null, voiceOn=false, voiceRestarting=false;
function initVoice(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){
    toast('⚠️ Reconnaissance vocale non disponible sur ce navigateur. Essayez Chrome (Android) ou Safari (iOS 14.5+)',5000);
    return false;
  }
  recognition=new SR();
  recognition.lang='fr-FR';
  recognition.continuous=false;
  recognition.interimResults=false;
  recognition.maxAlternatives=5;
  recognition.onstart=()=>{voiceRestarting=false;updateVoiceBtn();};
  recognition.onresult=e=>{
    for(let i=0;i<e.results[e.resultIndex].length;i++){
      const mots=e.results[e.resultIndex][i].transcript.trim().toUpperCase()
        .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
        .replace(/[^A-Z\s]/g,'').split(/\s+/);
      for(const m of mots){
        if(S.run){
          // Chrono en route : on attend HALTE uniquement
          if(['A',HA','ALT','HALTE','HALT','ALTO','ALTE','HOLTE'].includes(m)){
            toggleTimer();toast('HALTE !',200);return;
          }
        } else {
          // Chrono arrêté : on attend ALLEZ uniquement
          if(['ALLEZ','ALLE','ALLER','ALLES','ALEZ','ALES','ALLET','ALLEE'].includes(m)){
            if(!S.pDone&&!S.over&&!S.restMode&&S.tb==='none'){
              toggleTimer();toast('ALLEZ !',200);return;
            }
          }
        }
      }
    }
  };
  recognition.onerror=e=>{
    if(e.error==='not-allowed'){toast('🎤 Micro refusé — acceptez la permission',4000);voiceOn=false;updateVoiceBtn();return;}
    restartVoice();
  };
  recognition.onend=()=>{restartVoice();};
  return true;
}
function restartVoice(){
  if(!voiceOn||voiceRestarting)return;
  voiceRestarting=true;
  setTimeout(()=>{if(voiceOn&&recognition){try{recognition.start();}catch(e){voiceRestarting=false;}}},300);
}
function toggleVoice(){
  if(!recognition&&!initVoice())return;
  voiceOn=!voiceOn;
  if(voiceOn){try{recognition.start();}catch(e){}toast('🎤 Dites ALLEZ ou HALTE',3000);}
  else{try{recognition.abort();}catch(e){}}
  updateVoiceBtn();
}
function updateVoiceBtn(){
  const b=document.getElementById('voiceBtn');if(!b)return;
  b.textContent=voiceOn?'🎤':'🎙️';
  b.style.color=voiceOn?'#22cc66':'#555';
  b.style.border=voiceOn?'1px solid #22cc66':'1px solid #2a2a2a';
  b.style.background=voiceOn?'#001a00':'#181818';
}

function adjTimer(d){S.mT=Math.max(0,Math.min(600,S.mT+d));addLog((d>0?'+':'')+d+'s chrono principal ('+fmt(S.mT)+')');ra();}

function enableNoSleep() {
    // 1. Vidéo silencieuse en boucle (fonctionne sur file:// et HTTPS)
    if (!noSleepVideo) {
        noSleepVideo = document.createElement('video');
        noSleepVideo.setAttribute('loop', '');
        noSleepVideo.setAttribute('playsinline', '');
        noSleepVideo.setAttribute('muted', '');
        noSleepVideo.setAttribute('webkit-playsinline', '');
        noSleepVideo.style.cssText = 'position:fixed;width:1px;height:1px;top:-2px;left:-2px;opacity:0.01;pointer-events:none;';
        noSleepVideo.src = NO_SLEEP_SRC;
        document.body.appendChild(noSleepVideo);
    }
    noSleepVideo.play().catch(()=>{});

    // 2. Wake Lock API en complément (HTTPS uniquement)
    if ('wakeLock' in navigator) {
        navigator.wakeLock.request('screen').then(wl => { wakeLock = wl; }).catch(()=>{});
    }

    // 3. Web Audio silence (fallback supplémentaire)
    try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const buf = ctx.createBuffer(1, 1, 22050);
        const src = ctx.createBufferSource();
        src.buffer = buf; src.loop = true;
        src.connect(ctx.destination); src.start(0);
    } catch(e) {}
}

document.addEventListener('touchstart', enableNoSleep, {once:false, passive:true});
document.addEventListener('click', enableNoSleep, {once:true});
document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') enableNoSleep();
});
